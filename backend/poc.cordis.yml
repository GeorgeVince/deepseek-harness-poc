- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openai-codex:
        apiKeyEnv: OPENAI_TOKEN
        reasoning: high
      openai:
        apiKeyEnv: OPENAI_API_KEY
        reasoning: high

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: You are the coordinator. Delegate weather-only requests to ask_weather_agent. For multiple weather locations, call ask_weather_agent once per location in the same response so they run concurrently, then combine the results. Delegate activities and things-to-do requests only to ask_activities_agent, even when they mention weather; that agent can fetch weather itself. Give each agent a standalone prompt with all relevant context and do not answer specialist requests yourself. Use run_bash or run_python for sandboxed calculations and local data processing when useful. For Excel workbooks in /workspace, use the installed Formualizer Python package through run_python; write derived workbooks as new .xlsx files rather than overwriting the source.
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: subagents
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: weather-agent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: ask_weather_agent
    enableRunInBackground: false
    maxDepth: 1
    toolFilter:
      allow:
        - mcp__python__get_uk_weather
    persona: You are a weather specialist. Always use get_uk_weather to answer the delegated weather question. Ask for a location when needed and distinguish live conditions from rough monthly estimates.

- id: activities-agent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: ask_activities_agent
    enableRunInBackground: false
    maxDepth: 1
    toolFilter:
      allow:
        - mcp__python__get_uk_weather
        - mcp__python__suggest_uk_activities
    persona: You are an activities specialist. For current recommendations, get the weather first, then use suggest_uk_activities. Return concise suggestions and clearly state that the activities are fictional.

# rc.6's bundled Python runtime omits this plugin, so app.py launches the npm
# JSON-RPC runtime until the next runtime wheel includes it.
- id: mcp-python
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: python
    transport: stdio
    command: !!js process.env.MCP_PYTHON
    args:
      - !!js process.env.MCP_SERVER
    cwd: !!js process.env.DSH_CWD
    failOnStartupError: true

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
