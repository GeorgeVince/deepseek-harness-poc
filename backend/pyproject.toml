[project]
name = "deepseek-harness-openai-poc"
version = "0.1.0"
description = "Python SDK chatbot POC using DeepSeek Harness and OpenAI credentials"
requires-python = ">=3.10"
dependencies = [
  "arize-phoenix-otel>=0.16",
  "deepseek-harness-sdk==0.1.0rc6",
  "fastmcp==3.4.7",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
