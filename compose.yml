services:
  phoenix:
    image: arizephoenix/phoenix:20.2.1
    ports:
      - "127.0.0.1:${PHOENIX_PORT:-6006}:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006/readyz')"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - phoenix_data:/mnt/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sandbox-runner:
    build:
      context: .
      target: sandbox-runner
    init: true
    network_mode: none
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - agent_workspace:/workspace
      - sandbox_socket:/run/sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import json,socket; s=socket.socket(socket.AF_UNIX); s.connect('/run/sandbox/runner.sock'); s.sendall(b'{\\\"kind\\\":\\\"health\\\"}\\n'); assert json.loads(s.recv(100))['ok']"]
      interval: 3s
      timeout: 3s
      retries: 10

  chatbot:
    build:
      context: .
      target: production
    init: true
    depends_on:
      phoenix:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      HOME: /tmp
      OPENAI_TOKEN: ${OPENAI_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      DATABASE_URL: postgresql://chatbot:chatbot@postgres/chatbot
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_CAPTURE_CONTENT: ${PHOENIX_CAPTURE_CONTENT:-true}
      AGENT_WORKSPACE: /workspace
      SANDBOX_SOCKET: /run/sandbox/runner.sock
    pids_limit: 256
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./.dsh:/app/.dsh
      - agent_workspace:/workspace
      - sandbox_socket:/run/sandbox:ro

volumes:
  agent_workspace:
  sandbox_socket:
  phoenix_data:
  postgres_data:
